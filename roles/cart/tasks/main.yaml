- name: Run app setup
  ansible.builtin.import_role:
    name: common
    tasks_from: app-setup.yaml

- name: Run nodejs setup
  ansible.builtin.import_role:
    name: common
    tasks_from: nodejs-setup.yaml


- name: Run systemd setup
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd-setup.yaml


- name: start cart
  ansible.builtin.service:
    name: cart
    state: restarted
    enabled: yes  


